filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/*.log
    - /logs/sample/*.log
  scan_frequency: 1s
  close_inactive: 10m
  ignore_older: 0
  close_removed: true
  harvester_buffer_size: 16384

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

setup.template.settings:
  index.number_of_shards: 1

output.kafka:
  hosts: ["kafka:9092"]
  topic: logs_raw
  partition.round_robin:
    reachable_only: false
  required_acks: 1
  compression: gzip
  max_message_bytes: 10485760
  bulk_max_size: 1024

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644