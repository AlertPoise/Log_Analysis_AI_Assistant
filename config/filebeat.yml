
filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /home/syb/Downloads/project/Log_Analysis_AI_Assistant/tests/collectors/sample_logs/*.log
  fields:
    log_type: vpn
  fields_under_root: true

output.kafka:
  hosts: ["localhost:9092"]
  topic: "logs_raw"
  partition.round_robin:
    reachable_only: false
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000

logging.level: warning
logging.to_files: true
logging.files:
  path: /home/syb/Downloads/project/Log_Analysis_AI_Assistant/filebeat_logs
  name: filebeat
  keepfiles: 7
