services:
  # ClickHouse 初始化容器（使用 server 镜像，已包含 clickhouse-client）
  clickhouse-init:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-init
    depends_on:
      - clickhouse
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-log_analysis}
    volumes:
      - ../config/clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      /bin/sh -c "
      sleep 30 && \
      clickhouse-client --host $CLICKHOUSE_HOST --port $CLICKHOUSE_PORT --user $CLICKHOUSE_USER --password '$CLICKHOUSE_PASSWORD' --database $CLICKHOUSE_DATABASE --multiquery < /docker-entrypoint-initdb.d/init.sql && \
      echo 'ClickHouse tables initialized'
      "
    networks:
      - default

  # Kafka 服务
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-kraft
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "9092:9092"
    networks:
      - default

  # ClickHouse 服务
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    user: "101:101"
    container_name: clickhouse-server
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-log_analysis}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - default

  # ZooKeeper (可选，用于某些 Kafka 配置)
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888
    networks:
      - default

  # Filebeat 服务
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    volumes:
      - /var/log:/user/share/filebeat/logs
      - ./sample_logs:/logs/sample:ro
      - ./filebeat-docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./../../logs/filebeat:/var/log/filebeat
    depends_on:
      - kafka
    environment:
      - KAFKA_HOST=kafka:9092
    restart: unless-stopped
    networks:
      - default

volumes:
  clickhouse-data:
    driver: local

networks:
  default:
    name: log-analysis-network